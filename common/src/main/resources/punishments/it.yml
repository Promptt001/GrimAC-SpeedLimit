# Relaxed/anarchy default profile.
#
# Checks omitted from this file are genuinely disabled in this fork. This means
# Baritone, scaffold/air-place, vanilla movement prediction, timer, elytra state,
# no-slow, sprint, knockback and similar behavior checks do not setback/cancel.
# The explicit SpeedLimit check below is the movement rule that remains.
#
# %check_name% - name of the check
# %description% - description of the check
# %vl% - violations
# %verbose% - extra information
# %player% - player name
# [alert] - special command to alert
# [webhook] - special command to alert to discord webhook
# [proxy] - special command to alert to other servers connected to your proxy

Punishments:
  SpeedCap:
    remove-violations-after: 300
    checks:
      - "SpeedLimit"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "1:1 [proxy]"

  PacketSafety:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
      - "TransactionOrder"
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"

  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "1:1 [proxy]"

  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"

  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
